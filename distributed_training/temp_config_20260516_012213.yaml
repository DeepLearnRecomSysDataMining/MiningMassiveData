    replicaCount: 1
    containerSpec:
      imageUri: "asia-southeast1-docker.pkg.dev/mining-data-2/recsys-repo/distributed-training:v_20260516_012213"
      args:
        - "--baseline=3"
      env:
        - name: TRAINING_ENV
          value: "cloud"
        - name: GCS_BUCKET
          value: "gs://mining-data-2"

scheduling:
  strategy: "SPOT"